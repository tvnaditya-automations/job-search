name: Daily 7 AM Job Matcher

on:
  schedule:
    # Disabled daily schedule to avoid unintended billing.
    # Set to a non-existent date (Feb 31) so it will never run until intentionally changed.
    # If you want to re-enable daily runs, change back to: '30 1 * * *' (01:30 UTC -> 07:00 IST)
    - cron: '0 0 31 2 *'
  workflow_dispatch: # Allows testing manually from the GitHub UI

jobs:
  scrape-and-match:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python job_matcher.py
